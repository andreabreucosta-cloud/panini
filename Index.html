<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#0a0e1a;color:#e8eaf6;font-family:-apple-system,sans-serif;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100%;height:-webkit-fill-available;}
#header{background:linear-gradient(135deg,#1a237e,#283593,#1565c0);padding:max(env(safe-area-inset-top),12px) 14px 10px;border-bottom:2px solid #c8a217;flex-shrink:0;}
.hdr-top{text-align:center;margin-bottom:8px;}
.eyebrow{font-size:10px;letter-spacing:3px;color:#c8a217;text-transform:uppercase;margin-bottom:2px;}
.title{font-size:20px;font-weight:700;color:#fff;}
.sub{font-size:10px;color:#90caf9;margin-top:2px;}
.stats{display:flex;justify-content:center;gap:24px;margin-bottom:8px;}
.stat-n{font-size:24px;font-weight:700;line-height:1;}
.stat-l{font-size:9px;letter-spacing:1px;color:#90caf9;margin-top:2px;text-align:center;}
.progress{background:rgba(255,255,255,0.1);border-radius:4px;height:5px;margin-bottom:8px;}
.progress-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,#4caf50,#c8a217);transition:width .3s;}
#search{width:100%;padding:8px 12px;border-radius:6px;border:1px solid rgba(200,162,23,0.35);background:rgba(255,255,255,0.07);color:#e8eaf6;font-size:14px;outline:none;margin-bottom:8px;}
#search::placeholder{color:#546e7a;}
.tabs{display:flex;gap:5px;}
.tab{flex:1;padding:7px 4px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:700;}
.tab.active{background:#c8a217;color:#0a0e1a;}
.tab:not(.active){background:rgba(255,255,255,0.1);color:#e8eaf6;}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;}
.sec-hdr{padding:10px 14px 5px;font-size:10px;letter-spacing:3px;color:#c8a217;text-transform:uppercase;border-top:1px solid rgba(200,162,23,0.2);margin-top:4px;}
.team-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.06);-webkit-user-select:none;user-select:none;}
.team-hdr:active{background:rgba(255,255,255,0.05);}
.team-left{display:flex;align-items:center;gap:8px;}
.team-name{font-size:14px;font-weight:600;}
.team-name.por{color:#c8a217;}
.badge{font-size:10px;color:#90caf9;background:rgba(255,255,255,0.06);padding:2px 6px;border-radius:10px;}
.badge.done{color:#4caf50;}
.grid{display:flex;flex-wrap:wrap;gap:5px;padding:6px 10px 12px;}
.sticker{width:64px;min-height:58px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 3px;cursor:pointer;position:relative;border:2px dashed rgba(255,255,255,0.15);background:rgba(255,255,255,0.03);-webkit-user-select:none;user-select:none;transition:transform .1s;}
.sticker:active{transform:scale(0.88);}
.sticker.foil{border-color:rgba(200,162,23,0.3);}
.sticker.owned{border-style:solid;border-color:#4caf50;background:rgba(76,175,80,0.15);}
.sticker.owned.foil{border-color:#c8a217;background:rgba(200,162,23,0.15);}
.foil-star{position:absolute;top:2px;right:3px;font-size:7px;color:#c8a217;}
.s-code{font-size:9px;font-weight:700;color:#546e7a;margin-bottom:2px;}
.sticker.owned .s-code{color:#4caf50;}
.sticker.owned.foil .s-code{color:#c8a217;}
.s-name{font-size:8.5px;text-align:center;line-height:1.3;color:#37474f;}
.sticker.owned .s-name{color:#b0bec5;}
</style>
</head>

      const th=document.createElement("div");th.className="team-hdr";
      const tl=document.createElement("div");tl.className="team-left";
      const nm=document.createElement("div");nm.className="team-name"+(team==="Portugal"?" por":"");nm.textContent=team;
      const bd=document.createElement("div");bd.className="badge"+(done?" done":"");bd.textContent=on+"/"+all.length;
      tl.append(nm,bd);const ch=document.createElement("div");ch.style.cssText="font-size:11px;color:#546e7a";ch.textContent=isExp?"▲":"▼";
      th.append(tl,ch);
      th.onclick=()=>{exp[team]=!exp[team];save();render();document.getElementById("scroll").scrollTop=top;};
      sc.appendChild(th);
      if(isExp){
        const g=document.createElement("div");g.className="grid";
        for(const s of vis){
          const d=document.createElement("div");
          d.className="sticker"+(s.foil?" foil":"")+(owned[s.code]?" owned":"");
          if(s.foil){const st=document.createElement("div");st.className="foil-star";st.textContent="✦";d.appendChild(st);}
          const c=document.createElement("div");c.className="s-code";c.textContent=s.code;
          const n=document.createElement("div");n.className="s-name";n.textContent=s.name.length>16?s.name.substring(0,14)+"…":s.name;
          d.append(c,n);
          d.onclick=()=>{
            if(owned[s.code])delete owned[s.code];else owned[s.code]=1;
            save();upd();
            d.className="sticker"+(s.foil?" foil":"")+(owned[s.code]?" owned":"");
            bd.textContent=all.filter(x=>owned[x.code]).length+"/"+all.length;
            bd.className="badge"+(all.every(x=>owned[x.code])?" done":"");
          };
          g.appendChild(d);
        }
        sc.appendChild(g);
      }
    }
  }
  sc.scrollTop=top;
}
document.getElementById("search").addEventListener("input",e=>{q=e.target.value;render();upd();});
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");render();upd();}));
load();render();upd();
</script>
</body>
</html>
